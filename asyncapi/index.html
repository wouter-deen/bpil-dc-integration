<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPIL RabbitMQ Contracts</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@asyncapi/web-component@3.1.8/lib/asyncapi-web-component.js"></script>
</head>
<body>
  <nav aria-label="API documentation">
    <a href="../">REST APIs (Swagger UI)</a> |
    <a href="#dc">DC RabbitMQ contract</a> |
    <a href="#ct">CT RabbitMQ contract</a>
  </nav>
  <main>
    <h1>BPIL RabbitMQ Contracts</h1>
    <noscript>Enable JavaScript to render the AsyncAPI documentation.</noscript>
    <section aria-labelledby="dc">
      <h2 id="dc">DC RabbitMQ contract</h2>
      <p><a href="../contracts/RabbitMQ/dc-asyncapi.yaml">DC AsyncAPI YAML</a></p>
      <asyncapi-component
        schemaUrl="../contracts/RabbitMQ/dc-asyncapi.yaml"
        config='{"schemaID":"dc"}'
        cssImportPath="https://cdn.jsdelivr.net/npm/@asyncapi/react-component@3.2.3/styles/default.min.css">
      </asyncapi-component>
    </section>
    <section aria-labelledby="ct">
      <h2 id="ct">CT RabbitMQ contract</h2>
      <p><a href="../contracts/RabbitMQ/ct-asyncapi.yaml">CT AsyncAPI YAML</a></p>
      <asyncapi-component
        schemaUrl="../contracts/RabbitMQ/ct-asyncapi.yaml"
        config='{"schemaID":"ct"}'
        cssImportPath="https://cdn.jsdelivr.net/npm/@asyncapi/react-component@3.2.3/styles/default.min.css">
      </asyncapi-component>
    </section>
  </main>
</body>
</html>
