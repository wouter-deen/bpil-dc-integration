<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>BPIL REST API Contracts</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.36.0/swagger-ui.css"
        />
    </head>
    <body>
        <nav class="swagger-ui" aria-label="API documentation">
            <a href="./asyncapi/">RabbitMQ APIs (AsyncAPI)</a>
        </nav>
        <div id="swagger-ui"></div>
        <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.36.0/swagger-ui-bundle.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.36.0/swagger-ui-standalone-preset.js"></script>
        <script>
            SwaggerUIBundle({
                dom_id: "#swagger-ui",
                urls: [
                    {
                        name: "DC REST API",
                        url: "./contracts/REST%20API/dc-api.yaml",
                    },
                    {
                        name: "CT REST API",
                        url: "./contracts/REST%20API/ct-api.yaml",
                    },
                ],
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset,
                ],
                layout: "StandaloneLayout",
                supportedSubmitMethods: [],
                validatorUrl: null,
            });
        </script>
    </body>
</html>
