name: Deploy Swagger UI to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/configure-pages@v5
            - name: Stage Swagger UI and OpenAPI contracts
              run: |
                  mkdir -p '_site/contracts/REST API'
                  cp swagger/index.html _site/index.html
                  cp 'contracts/REST API/dc-api.yaml' 'contracts/REST API/ct-api.yaml' '_site/contracts/REST API/'
            - uses: actions/upload-pages-artifact@v4
              id: upload
              with:
                  path: _site
            - name: Verify Pages artifact upload
              env:
                  ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
              run: |
                  if [ -z "$ARTIFACT_ID" ]; then
                    echo '::error::The Pages upload step did not return an artifact ID. Check the upload logs.'
                    exit 1
                  fi
            - uses: actions/deploy-pages@v4
              id: deployment
