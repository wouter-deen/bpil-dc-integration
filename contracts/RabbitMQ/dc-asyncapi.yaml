asyncapi: 3.0.0
info:
    title: DC RabbitMQ interface
    version: 0.1.0
    description: See integration-contract.md document for queue bindings.
servers:
    dc:
        host: localhost:5672
        protocol: amqp
        protocolVersion: 0-9-1
defaultContentType: application/json
channels:
    arrivalUpdate:
        address: dc.1.arrival.update
        messages:
            incoming_order_update:
                $ref: "#/components/messages/incoming_order_update"
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: scm.v1
                    type: direct
                    durable: true
                    autoDelete: false
                    vhost: /
                bindingVersion: 0.3.0
    actualArrival:
        address: dc.1.arrival.actual
        messages:
            actual_arrival:
                $ref: "#/components/messages/actual_arrival"
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: scm.v1
                    type: direct
                    durable: true
                    autoDelete: false
                    vhost: /
                bindingVersion: 0.3.0
    scheduleUpdate:
        address: ct.1.schedule.update
        messages:
            outgoing_order_update:
                $ref: "#/components/messages/outgoing_order_update"
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: scm.v1
                    type: direct
                    durable: true
                    autoDelete: false
                    vhost: /
                bindingVersion: 0.3.0
    loadingConfirmation:
        address: ct.1.loading.confirmation
        messages:
            outgoing_loading_confirmation:
                $ref: "#/components/messages/outgoing_loading_confirmation"
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: scm.v1
                    type: direct
                    durable: true
                    autoDelete: false
                    vhost: /
                bindingVersion: 0.3.0
operations:
    receiveArrivalUpdate:
        action: receive
        channel:
            $ref: "#/channels/arrivalUpdate"
        messages:
            - $ref: "#/channels/arrivalUpdate/messages/incoming_order_update"
    receiveActualArrival:
        action: receive
        channel:
            $ref: "#/channels/actualArrival"
        messages:
            - $ref: "#/channels/actualArrival/messages/actual_arrival"
    sendScheduleUpdate:
        action: send
        channel:
            $ref: "#/channels/scheduleUpdate"
        messages:
            - $ref: "#/channels/scheduleUpdate/messages/outgoing_order_update"
    sendLoadingConfirmation:
        action: send
        channel:
            $ref: "#/channels/loadingConfirmation"
        messages:
            - $ref: "#/channels/loadingConfirmation/messages/outgoing_loading_confirmation"
components:
    messages:
        incoming_order_update:
            name: incoming_order_update
            payload:
                type: object
                required:
                    - order_id
                    - arrival_time_at_dc
                additionalProperties: false
                properties:
                    order_id:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                        description: Globally unique order ID, allocated by CT for this interface.
                    arrival_time_at_dc:
                        type: string
                        format: date-time
                        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
                        description: Expected arrival as a UTC timestamp with whole-second precision.

            examples:
                - payload:
                      order_id: 1001
                      arrival_time_at_dc: "2026-11-28T10:02:23Z"

        actual_arrival:
            name: actual_arrival
            payload:
                type: object
                required:
                    - order_id
                    - actual_arrival_time_at_dc
                additionalProperties: false
                properties:
                    order_id:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                        description: Globally unique order ID, allocated by CT for this interface.
                    actual_arrival_time_at_dc:
                        type: string
                        format: date-time
                        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
                        description: Actual arrival as a UTC timestamp with whole-second precision.
            examples:
                - payload:
                      order_id: 1001
                      actual_arrival_time_at_dc: "2026-11-28T10:02:23Z"
        outgoing_order_update:
            name: outgoing_order_update
            payload:
                type: object
                required:
                    - order_id
                    - dock_id
                    - start_loading_time
                    - estimated_departure_time

                additionalProperties: false
                properties:
                    order_id:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                        description: Globally unique order ID, allocated by CT for this interface.
                    dock_id:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                        description: DC-local dock ID.
                    start_loading_time:
                        type: string
                        format: date-time
                        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
                        description: Planned loading start as a UTC timestamp with whole-second precision.
                    estimated_departure_time:
                        type: string
                        format: date-time
                        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
                        description: Planned departure as a UTC timestamp with whole-second precision.

            examples:
                - payload:
                      order_id: 1001
                      dock_id: 2
                      start_loading_time: "2026-11-28T10:02:23Z"
                      estimated_departure_time: "2026-11-28T10:02:33Z"

        outgoing_loading_confirmation:
            name: outgoing_loading_confirmation
            payload:
                type: object
                required:
                    - order_id
                additionalProperties: false
                properties:
                    order_id:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                        description: Globally unique order ID, allocated by CT for this interface.
            examples:
                - payload:
                      order_id: 1001
