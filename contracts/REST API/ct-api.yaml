openapi: 3.0.3
info:
  title: CT REST API
  version: 0.1.0
  description: "Draft DC\u2013CT integration; base URL is illustrative."
servers:
- url: http://localhost:8081/rest/integration/v1
paths:
  /handling-times:
    post:
      operationId: handling_time_request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handling_time_request'
            example:
              order_id: 1001
              quantity: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handling_time_response'
              example:
                order_id: 1001
                staging_duration: 10
                loading_duration: 5
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicting order or state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    handling_time_request:
      type: object
      required:
      - order_id
      - quantity
      additionalProperties: false
      properties:
        order_id:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Globally unique order ID, allocated by CT for this interface.
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Positive integer standard quantity units.
    handling_time_response:
      type: object
      required:
      - order_id
      - staging_duration
      - loading_duration
      additionalProperties: false
      properties:
        order_id:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Globally unique order ID, allocated by CT for this interface.
        staging_duration:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Duration in ticks.
        loading_duration:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Positive duration in ticks.
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
