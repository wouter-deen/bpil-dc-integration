openapi: 3.0.3
info:
    title: DC REST API
    version: 0.1.0
    description: "Draft DC\u2013CT integration; base URL is illustrative."
servers:
    - url: http://localhost:8080/rest/integration/v1
paths:
    /orders:
        post:
            operationId: new_order
            description: Creates a new order. The Control Tower determines staging and loading durations according to the case description and includes them in the initial order.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/new_order"
                        example:
                            order_id: 1001
                            quantity: 50
                            staging_duration: 25
                            loading_duration: 10
                            arrival_time_at_dc: "2026-11-28T10:02:30Z"
                            truck_id: 301
                            control_tower_id: 1
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/new_order_response"
                            example:
                                order_id: 1001
                                dock_id: 2
                                start_loading_time: "2026-11-28T10:02:30Z"
                                estimated_departure_time: "2026-11-28T10:02:40Z"
                "400":
                    description: Invalid payload
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: Conflicting order or state
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "503":
                    description: Dependency temporarily unavailable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
components:
    schemas:
        new_order:
            type: object
            required:
                - order_id
                - quantity
                - staging_duration
                - loading_duration
                - arrival_time_at_dc
                - truck_id
                - control_tower_id
            additionalProperties: false
            properties:
                order_id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                    description: Globally unique order ID, allocated by CT for this interface.
                quantity:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                    description: Positive integer standard quantity units.
                staging_duration:
                    type: integer
                    minimum: 0
                    maximum: 2147483647
                    description: Staging duration in seconds.
                loading_duration:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                    description: Positive loading duration in seconds.
                arrival_time_at_dc:
                    type: string
                    format: date-time
                    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
                    description: Expected arrival as a UTC timestamp with whole-second precision.
                truck_id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                    description: Globally unique truck ID.
                control_tower_id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                    description: CT instance ID.
        new_order_response:
            type: object
            required:
                - order_id
                - dock_id
                - start_loading_time
                - estimated_departure_time
            additionalProperties: false
            properties:
                order_id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                    description: Globally unique order ID, allocated by CT for this interface.
                dock_id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                    description: DC-local dock ID.
                start_loading_time:
                    type: string
                    format: date-time
                    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
                    description: Planned loading start as a UTC timestamp with whole-second precision.
                estimated_departure_time:
                    type: string
                    format: date-time
                    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
                    description: Planned departure as a UTC timestamp with whole-second precision.
        Error:
            type: object
            required:
                - code
                - message
            properties:
                code:
                    type: string
                message:
                    type: string
